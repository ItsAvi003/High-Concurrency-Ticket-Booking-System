[pytest]
# --ds on the command line beats the DJANGO_SETTINGS_MODULE env var (which is "dev" inside
# the container). A plain `DJANGO_SETTINGS_MODULE = ...` line here would lose to the env var.
addopts = --ds=config.settings.test -ra --strict-markers
python_files = test_*.py
testpaths = apps
# A JWT signing key that is too short must fail the suite, not scroll past as a warning.
filterwarnings =
    error::jwt.warnings.InsecureKeyLengthWarning
